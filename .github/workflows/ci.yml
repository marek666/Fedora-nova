name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            meson ninja-build python3 python3-gobject \
            gtk4-devel libadwaita-devel glib2-devel \
            desktop-file-utils appstream sassc

      - name: Static checks
        run: ./check.sh

      - name: Regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Build
        run: meson compile -C _build

      - name: Install into staging directory
        run: DESTDIR="$PWD/_staging" meson install -C _build

      - name: Validate staging payload
        run: |
          if find _staging -type f \( -name '*.pyc' -o -name 'SHA256SUMS' -o -name 'build-theme-sass.sh' \) -print -quit | grep -q .; then
            echo 'Unexpected development/stale files found in staging payload:' >&2
            find _staging -type f \( -name '*.pyc' -o -name 'SHA256SUMS' -o -name 'build-theme-sass.sh' \) -print >&2
            exit 1
          fi
          if find _staging -type d -name 'themes-src' -print -quit | grep -q .; then
            echo 'themes-src must not be shipped in the runtime payload.' >&2
            find _staging -type d -name 'themes-src' -print >&2
            exit 1
          fi

          core_root="_staging/usr/share/fedora-nova/core"
          for forbidden in \
            install.sh \
            uninstall.sh \
            config/colors.json \
            config/packages.txt \
            scripts/install-assets.sh \
            scripts/check-compatibility.sh; do
            if [[ -e "$core_root/$forbidden" ]]; then
              echo "Source-only or stale file leaked into package runtime: $forbidden" >&2
              exit 1
            fi
          done

          for required in \
            nova \
            config/profiles.json \
            config/curves.json \
            scripts/install-user-assets.sh \
            scripts/migrate-installation.sh; do
            if [[ ! -e "$core_root/$required" ]]; then
              echo "Required canonical runtime file missing from staging: $required" >&2
              exit 1
            fi
          done

          for required_data in \
            applications/io.github.fedoranova.FedoraNova.desktop \
            applications/io.github.fedoranova.FedoraNova.Devel.desktop \
            metainfo/io.github.fedoranova.FedoraNova.metainfo.xml \
            metainfo/io.github.fedoranova.FedoraNova.Devel.metainfo.xml; do
            if [[ ! -f "_staging/usr/share/$required_data" ]]; then
              echo "Required application metadata missing from staging: $required_data" >&2
              exit 1
            fi
          done
