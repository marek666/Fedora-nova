name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            meson ninja-build python3 python3-gobject \
            gtk4-devel libadwaita-devel glib2-devel \
            desktop-file-utils appstream sassc

      - name: Static checks
        run: ./check.sh

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Build
        run: meson compile -C _build

      - name: Install into staging directory
        run: DESTDIR="$PWD/_staging" meson install -C _build

      - name: Validate staging payload
        run: |
          if find _staging -type f \( -name '*.pyc' -o -name 'SHA256SUMS' -o -name 'build-theme-sass.sh' \) -print -quit | grep -q .; then
            echo 'Unexpected development/stale files found in staging payload:' >&2
            find _staging -type f \( -name '*.pyc' -o -name 'SHA256SUMS' -o -name 'build-theme-sass.sh' \) -print >&2
            exit 1
          fi
          if find _staging -type d -name 'themes-src' -print -quit | grep -q .; then
            echo 'themes-src must not be shipped in the runtime payload.' >&2
            find _staging -type d -name 'themes-src' -print >&2
            exit 1
          fi
