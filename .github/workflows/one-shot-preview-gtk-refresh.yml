name: One-shot Preview GTK refresh

on:
  push:
    branches:
      - fix/shell-preview-stability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[preview-gtk-refresh-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shell-preview-stability
          fetch-depth: 0

      - name: Add incremental GTK refresh to smart watcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/scripts/preview_reload.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''IGNORE = "IGNORE"\nTHEME_RELOAD = "THEME_RELOAD"\nASSET_REFRESH = "ASSET_REFRESH"''',
              '''IGNORE = "IGNORE"\nTHEME_RELOAD = "THEME_RELOAD"\nGTK_REFRESH = "GTK_REFRESH"\nASSET_REFRESH = "ASSET_REFRESH"''',
              'GTK constant')

          replace_once(
              '''    IGNORE: 0,\n    THEME_RELOAD: 10,\n    ASSET_REFRESH: 20,''',
              '''    IGNORE: 0,\n    THEME_RELOAD: 10,\n    GTK_REFRESH: 11,\n    ASSET_REFRESH: 20,''',
              'GTK rank')

          replace_once(
              '''THEME_GLOBS = (\n    "core/themes/**",\n    "core/themes-src/scss/**",\n    "core/scripts/hover_style.py",\n    "core/scripts/curve_style.py",\n    "core/scripts/build-theme-sass.sh",\n    "core/config/curves.json",\n)\n\nASSET_GLOBS''',
              '''THEME_GLOBS = (\n    "core/themes/**",\n    "core/themes-src/scss/**",\n    "core/scripts/hover_style.py",\n    "core/scripts/curve_style.py",\n    "core/scripts/build-theme-sass.sh",\n    "core/config/curves.json",\n)\n\nGTK_GLOBS = (\n    "core/scripts/gtk-theme.sh",\n)\n\nASSET_GLOBS''',
              'GTK globs')

          replace_once(
              '''    if _match(path, CONFIG_GLOBS):\n        return CONFIG_REFRESH\n    if _match(path, ASSET_GLOBS):\n        return ASSET_REFRESH\n    if _match(path, THEME_GLOBS):\n        return THEME_RELOAD''',
              '''    if _match(path, CONFIG_GLOBS):\n        return CONFIG_REFRESH\n    if _match(path, ASSET_GLOBS):\n        return ASSET_REFRESH\n    if _match(path, GTK_GLOBS):\n        return GTK_REFRESH\n    if _match(path, THEME_GLOBS):\n        return THEME_RELOAD''',
              'GTK classification')

          replace_once(
              '''def _print_hot_reload_success(details: list[dict[str, str]], theme: str) -> None:\n    print(f"Theme refresh requested: {theme}; setting and Shell identity verified, CSS application unacknowledged.", file=sys.stderr)\n\n\ndef _cmd_watch_once''',
              '''def _print_hot_reload_success(details: list[dict[str, str]], theme: str) -> None:\n    print(f"Theme refresh requested: {theme}; setting and Shell identity verified, CSS application unacknowledged.", file=sys.stderr)\n\n\ndef _run_gtk_refresh(repo_root: Path, check_alive=None) -> None:\n    import theme_hot_reload as hot\n\n    env = os.environ.copy()\n    env["FEDORA_NOVA_APP_DIR"] = str(repo_root / "core")\n    env.pop("BASH_ENV", None)\n    env.pop("ENV", None)\n    hot.run_checked(\n        [str(repo_root / "core/scripts/gtk-theme.sh"), "refresh"],\n        env=env,\n        timeout=15,\n        check_alive=check_alive,\n    )\n\n\ndef _incremental_actions(details: list[dict[str, str]]) -> tuple[str, ...]:\n    actions = {item.get("action") for item in details}\n    if not actions or not actions.issubset({THEME_RELOAD, GTK_REFRESH}):\n        return ()\n    result = []\n    if THEME_RELOAD in actions:\n        result.append(THEME_RELOAD)\n    if GTK_REFRESH in actions:\n        result.append(GTK_REFRESH)\n    return tuple(result)\n\n\ndef _cmd_watch_once''',
              'GTK runner/helpers')

          old_loop = '''                attempted_reload = False\n                details = []\n                while True:\n                    try:\n                        hot.checkpoint()\n                        action, details = collector.next_batch()\n                        if action != THEME_RELOAD:\n                            break\n                        attempted_reload = True\n                        collector.reconcile()\n                        collector.pump()\n                        if not collector.pending:\n                            theme = _run_theme_hot_reload(root, token, check_alive=collector.pump)\n                            collector.reconcile()\n                            collector.pump()\n                        if collector.pending:\n                            combined = {item["path"] for item in details} | collector.pending\n                            _, details = classify_paths(sorted(combined), root)\n                            action = FULL_SHELL_RESTART\n                            break\n                        _print_hot_reload_success(details, theme)\n                    except (SupervisorGone, hot.Cancelled):\n                        raise\n                    except (OSError, RuntimeError, ValueError, subprocess.TimeoutExpired) as exc:\n                        if not attempted_reload:\n                            raise\n                        print(f"Theme refresh rejected; requesting full restart: {exc}", file=sys.stderr)\n                        action = FULL_SHELL_RESTART\n                        break'''

          new_loop = '''                attempted_reload = False\n                details = []\n                while True:\n                    try:\n                        hot.checkpoint()\n                        action, details = collector.next_batch()\n                        incremental = _incremental_actions(details)\n                        if not incremental:\n                            break\n                        attempted_reload = True\n\n                        # Reconcile before applying anything so an edit that arrived\n                        # at the debounce boundary cannot be silently skipped.\n                        collector.reconcile()\n                        collector.pump()\n                        if collector.pending:\n                            combined = {item["path"] for item in details} | collector.pending\n                            _, details = classify_paths(sorted(combined), root)\n                            action = FULL_SHELL_RESTART\n                            break\n\n                        for operation in incremental:\n                            if operation == THEME_RELOAD:\n                                theme = _run_theme_hot_reload(root, token, check_alive=collector.pump)\n                                _print_hot_reload_success(details, theme)\n                            elif operation == GTK_REFRESH:\n                                _run_gtk_refresh(root, check_alive=collector.pump)\n                                print("GTK preview layer refreshed; nested Shell and watcher kept alive.", file=sys.stderr)\n\n                            collector.reconcile()\n                            collector.pump()\n                            if collector.pending:\n                                combined = {item["path"] for item in details} | collector.pending\n                                _, details = classify_paths(sorted(combined), root)\n                                action = FULL_SHELL_RESTART\n                                break\n                        if action == FULL_SHELL_RESTART:\n                            break\n                    except (SupervisorGone, hot.Cancelled):\n                        raise\n                    except (OSError, RuntimeError, ValueError, subprocess.TimeoutExpired) as exc:\n                        if not attempted_reload:\n                            raise\n                        print(f"Incremental preview refresh rejected; requesting full restart: {exc}", file=sys.stderr)\n                        action = FULL_SHELL_RESTART\n                        break'''
          replace_once(old_loop, new_loop, 'incremental watcher loop')

          path.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('dev-shell-preview.sh')
          text = path.read_text(encoding='utf-8')
          old = '''    "IGNORE",\n    "THEME_RELOAD",\n    "ASSET_REFRESH",'''
          new = '''    "IGNORE",\n    "THEME_RELOAD",\n    "GTK_REFRESH",\n    "ASSET_REFRESH",'''
          if text.count(old) != 1:
              raise SystemExit(f'watch result action set: expected one match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add incremental refresh regressions
        run: |
          cat > tests/test_preview_incremental_refresh.py <<'PY'
          import contextlib
          import io
          import json
          import os
          from pathlib import Path
          import sys
          import tempfile
          import unittest
          from unittest.mock import MagicMock, patch

          REPO = Path(__file__).resolve().parents[1]
          sys.path.insert(0, str(REPO / 'core/scripts'))
          import preview_reload as watch
          import theme_hot_reload as hot

          TOKEN = 'ab' * 16


          class IncrementalGtkRefresh(unittest.TestCase):
              def test_classifier_treats_gtk_theme_as_incremental(self):
                  self.assertEqual(watch.classify_path('core/scripts/gtk-theme.sh'), watch.GTK_REFRESH)
                  self.assertEqual(
                      watch._incremental_actions([
                          {'path': 'core/themes/t.css', 'action': watch.THEME_RELOAD},
                          {'path': 'core/scripts/gtk-theme.sh', 'action': watch.GTK_REFRESH},
                      ]),
                      (watch.THEME_RELOAD, watch.GTK_REFRESH),
                  )
                  self.assertEqual(
                      watch._incremental_actions([
                          {'path': 'core/scripts/gtk-theme.sh', 'action': watch.GTK_REFRESH},
                          {'path': 'core/config/profiles.json', 'action': watch.CONFIG_REFRESH},
                      ]),
                      (),
                  )

              def test_gtk_refresh_uses_isolated_preview_environment(self):
                  with tempfile.TemporaryDirectory(prefix='nova-gtk-refresh-') as tmp:
                      root = Path(tmp)
                      script = root / 'core/scripts/gtk-theme.sh'
                      script.parent.mkdir(parents=True)
                      script.write_text('#!/bin/sh\n', encoding='utf-8')
                      script.chmod(0o755)
                      captured = {}
                      def run_checked(command, **kwargs):
                          captured['command'] = command
                          captured['env'] = kwargs['env']
                          return ''
                      with patch.object(hot, 'run_checked', run_checked), patch.dict(os.environ, {
                          'HOME': '/preview/home',
                          'XDG_CONFIG_HOME': '/preview/config',
                          'XDG_DATA_HOME': '/preview/data',
                          'XDG_STATE_HOME': '/preview/state',
                      }, clear=False):
                          watch._run_gtk_refresh(root)
                      self.assertEqual(captured['command'], [str(script), 'refresh'])
                      self.assertEqual(captured['env']['FEDORA_NOVA_APP_DIR'], str(root / 'core'))
                      self.assertEqual(captured['env']['XDG_CONFIG_HOME'], '/preview/config')

              def test_mixed_theme_and_gtk_batch_runs_both_without_restart(self):
                  details = [
                      {'path': 'core/themes/t.css', 'action': watch.THEME_RELOAD},
                      {'path': 'core/scripts/gtk-theme.sh', 'action': watch.GTK_REFRESH},
                  ]
                  collector = MagicMock()
                  collector.__enter__.return_value = collector
                  collector.pending = set()
                  collector.next_batch.side_effect = [
                      (watch.GTK_REFRESH, details),
                      watch.SupervisorGone('done'),
                  ]
                  collector.pump.side_effect = lambda *args, **kwargs: None
                  calls = []
                  with tempfile.TemporaryDirectory(prefix='nova-mixed-refresh-') as tmp:
                      root = Path(tmp)
                      out, err = io.StringIO(), io.StringIO()
                      with patch.dict(os.environ, {'NOVA_PREVIEW_TOKEN': TOKEN}), \
                           patch.object(watch, 'Collector', return_value=collector), \
                           patch.object(watch, '_ensure_supervisor'), \
                           patch.object(hot, 'enable_subreaper'), \
                           patch.object(watch, '_run_theme_hot_reload', side_effect=lambda *a, **k: calls.append('theme') or 'Fedora-Nova-Tech'), \
                           patch.object(watch, '_run_gtk_refresh', side_effect=lambda *a, **k: calls.append('gtk')), \
                           contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
                          rc = watch.main(['watch-once', '--repo-root', str(root), '--supervisor-pid', str(os.getpid()), '--json'])
                  self.assertEqual(rc, 0)
                  self.assertEqual(calls, ['theme', 'gtk'])
                  self.assertIn('GTK preview layer refreshed', err.getvalue())


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Validate incremental GTK refresh
        run: |
          python3 -m py_compile core/scripts/preview_reload.py
          bash -n dev-shell-preview.sh
          python3 -m unittest -v tests.test_preview_incremental_refresh
          python3 -m unittest -v tests.test_preview_settings
          python3 -m unittest -v tests.test_shell_theme_st_compat

      - name: Commit integration and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-preview-gtk-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(preview): refresh GTK without Shell restart [preview-gtk-refresh-integrated]'
          git push origin HEAD:fix/shell-preview-stability
