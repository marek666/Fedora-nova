<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <defs>
    <radialGradient id="baseGlow" cx="72%" cy="42%" r="78%">
      <stop offset="0" stop-color="#122849"/>
      <stop offset="0.48" stop-color="#08111f"/>
      <stop offset="1" stop-color="#050a14"/>
    </radialGradient>
    <linearGradient id="tealWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ed8e8" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2ed8e8" stop-opacity="0.78"/>
      <stop offset="0.70" stop-color="#69eaf3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2ed8e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purpleWave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8c5cff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#8c5cff" stop-opacity="0.58"/>
      <stop offset="0.72" stop-color="#b09aff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#8c5cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wideGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#5d7597" stroke-width="1" opacity="0.075"/>
    </pattern>
  </defs>

  <rect width="2560" height="1600" fill="url(#baseGlow)"/>
  <rect width="2560" height="1600" fill="url(#grid)"/>

  <g opacity="0.32" fill="none" stroke="#395373" stroke-width="1.3">
    <circle cx="1860" cy="650" r="510"/>
